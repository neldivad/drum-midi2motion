[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "midi2motion"
version = "1.0.0"
description = "Drum MIDI in, an android drummer's motion out (realism first). Frozen solver, local web player."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "TBD (private preview)" }
dependencies = ["numpy>=1.26", "scipy>=1.11", "PyYAML>=6.0", "mido>=1.3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
midi2motion = "midi2motion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
midi2motion = ["rig/data/*", "rig/sibling/*.json", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
